<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fifteen Minutes</title>
  <meta name="description" content="Fifteen minutes to name every country, or every capital. Pick a round from the home page.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;1,9..144,560&family=Outfit:wght@420;560;650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <a class="brand brand-link" href="index.html">
      <p class="kicker" id="brand-kicker">World quiz</p>
      <h1>Fifteen Minutes</h1>
    </a>
    <div class="timer">
      <span class="time" id="time">15:00</span>
      <span class="time-label">remaining</span>
    </div>
    <div class="scorebox">
      <div class="score-readout">
        <span class="score" id="score">0</span>
        <span class="score-label">/ <span id="total">197</span></span>
      </div>
      <button type="button" class="ghost" id="end-btn" disabled>End game</button>
      <button type="button" class="ghost hidden" id="results-btn">Results</button>
    </div>
  </header>

  <main>
    <section class="map-card" aria-label="World map">
      <svg id="map" role="img" aria-label="World map">
        <g id="world"></g>
      </svg>
      <div class="legend">
        <span><i class="swatch q"></i>Still to name</span>
        <span><i class="swatch found"></i>Named</span>
        <span><i class="swatch complete"></i>Continent complete</span>
        <span id="legend-miss" class="hidden"><i class="swatch miss"></i>Missed</span>
      </div>
      <div class="map-tools">
        <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
        <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
        <button type="button" id="zoom-reset" aria-label="Reset the map view">⌂</button>
      </div>
      <p class="map-hint">Scroll to zoom. Drag to move.</p>
    </section>

    <form id="guess-form" class="guess" autocomplete="off">
      <div class="guess-row">
        <label for="guess" class="sr-only" id="guess-label">Answer</label>
        <input id="guess" name="answer" type="text" placeholder="" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" disabled>
        <button type="submit" id="guess-btn" disabled>Guess</button>
      </div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
    </form>

    <section class="progress">
      <div class="progress-head">
        <h2>By continent</h2>
        <p id="progress-blurb"></p>
      </div>
      <div class="board-wrap">
        <div class="board" id="board"></div>
      </div>
      <p class="foot" id="foot"></p>
    </section>
  </main>

  <div class="overlay" id="intro">
    <div class="card">
      <p class="kicker" id="intro-kicker">A blank atlas</p>
      <h2 id="intro-heading">Fifteen Minutes</h2>
      <p id="intro-copy"></p>
      <button type="button" class="primary" id="start-btn" disabled>Start the clock</button>
    </div>
  </div>

  <div class="overlay hidden" id="results">
    <div class="card wide" role="dialog" aria-labelledby="results-heading">
      <div id="results-body"></div>
      <div class="card-actions">
        <button type="button" class="primary" id="review-btn">Review the map</button>
        <button type="button" class="ghost" id="again-btn">Play again</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/game.mjs"></script>
</body>
</html>
